<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Beyblade X Quick Priority Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000; color: #fff; overflow: hidden;
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
    }

    #top-container {
      flex: 1 1 auto; width: 100%; min-height: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 12px; position: relative; background: #111;
      overflow-y: auto;
    }

    #status {
      font-size: 11px; color: #888; margin-bottom: 8px;
      background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 12px;
    }

    #input-preview {
      font-size: 1.8rem; font-weight: 900; color: #00ffcc;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(0,255,204,0.3);
      padding: 6px 24px; border-radius: 10px; margin-bottom: 10px;
      letter-spacing: 3px; text-shadow: 0 0 8px rgba(0,255,204,0.3);
    }

    #not-found-msg {
      font-size: 15px; color: #ff5252; font-weight: bold; display: none;
      background: rgba(255,82,82,0.1); padding: 8px 16px; border-radius: 8px; border: 1px solid #ff5252;
      margin-top: 5px;
    }

    #result-card {
      width: 100%; max-width: 360px;
      padding: 14px; border-radius: 14px; text-align: center;
      transition: all 0.2s ease; display: none; background: #222;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.2);
    }

    /* 圖片顯示容器 */
    #result-img-wrap {
      width: 100%; height: 140px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden;
    }
    #result-img {
      max-width: 100%; max-height: 100%; object-fit: contain;
    }

    #result-model { font-size: 26px; font-weight: 900; letter-spacing: 1px; }
    #result-price { font-size: 17px; font-weight: 700; margin-top: 2px; opacity: 0.95; }
    #result-priority { font-size: 20px; font-weight: 800; margin: 4px 0; text-transform: uppercase; }
    #result-note { font-size: 13px; line-height: 1.3; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; text-align: left; }

    .bg-very-high { background: #1b5e20 !important; border-color: #4caf50 !important; color: #ffffff; }
    .bg-high      { background: #0d47a1 !important; border-color: #2196f3 !important; color: #ffffff; }
    .bg-medium    { background: #e65100 !important; border-color: #ff9800 !important; color: #ffffff; }
    .bg-low       { background: #424242 !important; border-color: #9e9e9e !important; color: #e0e0e0; }

    #input-keypad-wrap {
      flex: 0 0 33vh; width: 100%;
      display: flex; background: #181818;
      border-top: 2px solid rgba(255,255,255,0.15);
      padding-bottom: env(safe-area-inset-bottom);
    }

    button {
      font-size: 1.3rem; font-weight: bold; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
      color: #fff; user-select: none; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 0.05s, background-color 0.05s, box-shadow 0.05s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.6);
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgba(0,0,0,0.6);
      background-color: #555 !important;
    }

    .keypad-left {
      width: 35%; display: flex; flex-direction: column; gap: 6px; padding: 8px;
      background: #101010; border-right: 1px solid rgba(255,255,255,0.1);
    }
    .keypad-left button { flex: 1; background: #282828; }
    .keypad-left button.active {
      background: #0288d1; border-color: #03a9f4; color: #fff;
      box-shadow: 0 0 8px rgba(3,169,244,0.5);
    }
    .keypad-left button.active:active { background: #02669e !important; }

    .keypad-right {
      width: 65%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px;
    }
    .keypad-right button { background: #222; }
    .keypad-right button.btn-del { background-color: #8f2d2d; border-color: #e57373; }
    .keypad-right button.btn-del:active { background-color: #b71c1c !important; }
  </style>
</head>
<body>

  <div id="top-container">
    <div id="status">正在同步 Google Sheet 資料...</div>
    <div id="input-preview">?? - __</div>
    <div id="not-found-msg">⚠️ 查無此型號資料</div>

    <div id="result-card">
      <div id="result-img-wrap" style="display: none;">
        <img id="result-img" src="" alt="Beyblade Image">
      </div>
      <div id="result-model">--</div>
      <div id="result-price">--</div>
      <div id="result-priority">--</div>
      <div id="result-note">--</div>
    </div>
  </div>

  <div id="input-keypad-wrap">
    <div class="keypad-left">
      <button onclick="selectMode('BX', this)">BX</button>
      <button onclick="selectMode('CX', this)">CX</button>
      <button onclick="selectMode('UX', this)">UX</button>
    </div>

    <div class="keypad-right">
      <button onclick="pressNumber('7')">7</button>
      <button onclick="pressNumber('8')">8</button>
      <button onclick="pressNumber('9')">9</button>
      <button onclick="pressNumber('4')">4</button>
      <button onclick="pressNumber('5')">5</button>
      <button onclick="pressNumber('6')">6</button>
      <button onclick="pressNumber('1')">1</button>
      <button onclick="pressNumber('2')">2</button>
      <button onclick="pressNumber('3')">3</button>
      <button class="btn-del" onclick="clearNumber()">⌫</button>
      <button onclick="pressNumber('0')">0</button>
      <button onclick="clearAll()" style="font-size: 0.9rem;">清空</button>
    </div>
  </div>

  <script>
    const SHEET_ID = '1wNFpe9U1bgbRGtU6uNlpkpFgrX-ictuisUpOLDqbmG4';
    let dbData = {};
    let selectedMode = "";
    let inputNumbers = "";

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(20);
    }

    async function fetchSheetData() {
      try {
        const response = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
        const text = await response.text();
        const json = JSON.parse(text.substring(47, text.length - 2));

        const rows = json.table.rows;
        
        // 左區塊：Model(A=0), Price(C=2), Priority(D=3), Note(E=4), ImgUrl(F=5)
        // 右區塊：Model(H=7), Price(J=9), Priority(K=10), Note(L=11), ImgUrl(M=12)
        const blocks = [
          { model: 0, price: 2, priority: 3, note: 4, img: 5 },
          { model: 7, price: 9, priority: 10, note: 11, img: 12 }
        ];

        rows.forEach(row => {
          if (!row.c) return;
          blocks.forEach(b => {
            const modelCell = row.c[b.model];
            if (!modelCell || modelCell.v === null || modelCell.v === undefined) return;

            const model = String(modelCell.v).trim().toUpperCase();
            if (!(model.includes('BX') || model.includes('UX') || model.includes('CX'))) return;

            const priceCell = row.c[b.price];
            const priorityCell = row.c[b.priority];
            const noteCell = row.c[b.note];
            const imgCell = row.c[b.img];

            const price = (priceCell && priceCell.v !== null && priceCell.v !== undefined) ? priceCell.v : null;
            const priority = (priorityCell && priorityCell.v) ? String(priorityCell.v).trim() : 'Low';
            const note = (noteCell && noteCell.v) ? String(noteCell.v).trim() : '';
            
            let imgUrl = (imgCell && imgCell.v) ? String(imgCell.v).trim() : '';

            const cleanKey = model.replace(/[^A-Z0-9]/g, '');
            dbData[cleanKey] = { rawModel: model, price, priority, note, imgUrl };
          });
        });

        document.getElementById('status').innerText = '✅ 清單已同步 (' + Object.keys(dbData).length + ' 款模型)';
      } catch (e) {
        document.getElementById('status').innerText = '❌ 同步失敗，請確認 Sheet 權限';
      }
    }

    function updatePreview() {
      const modeText = selectedMode ? selectedMode : "??";
      const numText = inputNumbers.padEnd(2, '_');
      document.getElementById('input-preview').innerText = `${modeText} - ${numText}`;
    }

    function selectMode(mode, btn) {
      triggerHaptic();
      selectedMode = mode;
      document.querySelectorAll('.keypad-left button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updatePreview();
      checkAndSearch();
    }

    function pressNumber(num) {
      triggerHaptic();
      if (inputNumbers.length >= 2) {
        inputNumbers = inputNumbers.slice(1) + num;
      } else {
        inputNumbers += num;
      }
      updatePreview();
      checkAndSearch();
    }

    function clearNumber() {
      triggerHaptic();
      if (inputNumbers.length > 0) {
        inputNumbers = inputNumbers.slice(0, -1);
        updatePreview();
        hideResults();
      }
    }

    function clearAll() {
      triggerHaptic();
      inputNumbers = "";
      selectedMode = "";
      document.querySelectorAll('.keypad-left button').forEach(b => b.classList.remove('active'));
      updatePreview();
      hideResults();
    }

    function checkAndSearch() {
      if (selectedMode && inputNumbers.length === 2) {
        const queryKey = selectedMode + inputNumbers;
        const item = dbData[queryKey];

        if (item) {
          showResult(item.rawModel, item.price, item.priority, item.note, item.imgUrl);
        } else {
          showNotFound();
        }
      } else {
        hideResults();
      }
    }

    function showResult(model, price, priority, note, imgUrl) {
      document.getElementById('not-found-msg').style.display = 'none';

      const card = document.getElementById('result-card');
      const modelEl = document.getElementById('result-model');
      const priceEl = document.getElementById('result-price');
      const priorityEl = document.getElementById('result-priority');
      const noteEl = document.getElementById('result-note');
      const imgWrap = document.getElementById('result-img-wrap');
      const imgEl = document.getElementById('result-img');

      if (imgUrl && imgUrl.startsWith('http')) {
        imgEl.src = imgUrl;
        imgWrap.style.display = 'flex';
      } else {
        imgWrap.style.display = 'none';
      }

      modelEl.innerText = model;
      priceEl.innerText = (price !== null && price !== undefined && price !== '')
        ? `原價：¥${Number(price).toLocaleString()}`
        : '原價：--';
      priorityEl.innerText = priority;
      noteEl.innerText = note ? `備註：${note}` : '（無備註）';

      card.className = '';
      const prioLower = priority.toLowerCase();

      if (prioLower.includes('very high')) {
        card.classList.add('bg-very-high');
      } else if (prioLower.includes('high')) {
        card.classList.add('bg-high');
      } else if (prioLower.includes('medium')) {
        card.classList.add('bg-medium');
      } else {
        card.classList.add('bg-low');
      }

      card.style.display = 'block';
    }

    function showNotFound() {
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('not-found-msg').style.display = 'block';
    }

    function hideResults() {
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('not-found-msg').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', fetchSheetData);
  </script>
</body>
</html>
